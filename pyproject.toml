[project]
name = "stock-analysis"
version = "0.1.0"
description = "AI-assisted equity research and reporting. Successor to FinRLExtension."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "RIT AI Club" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Runtime dependencies. Add with `uv add <package>`; never edit uv.lock by hand.
dependencies = []

[project.urls]
Repository = "https://github.com/RIT-AI-Club/Stock-Analysis"
Issues = "https://github.com/RIT-AI-Club/Stock-Analysis/issues"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analysis"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (replaces black, isort, flake8, pydocstyle)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle (docstrings)
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "S",       # flake8-bandit (security)
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PT",      # flake8-pytest-style
    "T20",     # no print() - use logging
    "DTZ",     # timezone-aware datetimes (important for market data)
    "RUF",     # ruff-specific
]
ignore = [
    "D105",  # magic methods don't need docstrings
    "D107",  # document __init__ args in the class docstring instead
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # asserts are fine in tests; test docstrings optional

# ---------------------------------------------------------------------------
# Mypy: static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true

# ---------------------------------------------------------------------------
# Pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (APIs, network). Skipped in CI by default.",
]

[tool.coverage.run]
source = ["stock_analysis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raise this once real code exists (target: 80).
fail_under = 0
